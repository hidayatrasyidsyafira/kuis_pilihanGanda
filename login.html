<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard Admin Ujian</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #e9ecef; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-container {
            background: white; padding: 40px 30px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px; width: 100%; text-align: center;
        }
        .login-icon { font-size: 3rem; margin-bottom: 10px; }
        h2 { color: #2c3e50; margin-bottom: 8px; }
        p { color: #7f8c8d; font-size: 0.95rem; margin-bottom: 25px; }
        
        input {
            width: 100%; padding: 14px; border: 2px solid #b8d8e8;
            border-radius: 8px; font-size: 1rem; margin-bottom: 15px;
            outline: none; text-align: center; transition: 0.2s;
        }
        input:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        
        button {
            width: 100%; padding: 15px; background: #3498db; color: white;
            border: none; border-radius: 8px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }

        /* CSS untuk Input Password dengan Ikon */
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }
        .password-wrapper input {
            margin-bottom: 0; /* Menghapus margin karena sudah diatur wrapper */
            padding-right: 45px; /* Beri ruang di kanan agar teks tidak tertutup ikon */
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            color: #7f8c8d;
            user-select: none;
            transition: 0.2s;
        }
        .toggle-password:hover {
            color: #3498db;
        }
        
    </style>
</head>
<body>
    <div class="login-container">
    <div class="login-icon">🔒</div>
    <h2 id="judul-form">Login Dashboard</h2>
    <p id="subjudul-form">Masukkan kredensial Anda untuk melanjutkan.</p>
    
    <!-- ===== FORM LOGIN ===== -->
    <div id="form-login">
        <input type="text" id="input-username" placeholder="Username" autocomplete="username">
        <div class="password-wrapper">
            <input type="password" id="input-password" placeholder="Password" autocomplete="current-password" onkeyup="if(event.key === 'Enter') prosesLogin()">
            <span class="toggle-password" onclick="togglePassword('input-password', this)">👁️</span>
        </div>
        <button id="btn-login" onclick="prosesLogin()">🔓 Masuk Dashboard</button>
        
        <p style="margin-top: 20px; font-size: 0.9rem;">
            Belum punya akun? <a href="javascript:void(0)" onclick="tampilkanFormDaftar()" style="color: #3498db; font-weight: bold; text-decoration: none;">Daftar di sini</a>
        </p>
    </div>

    <!-- ===== FORM DAFTAR (Tersembunyi) ===== -->
    <div id="form-daftar" style="display: none;">
        <input type="text" id="reg-nama" placeholder="Nama Lengkap (Cth: Budi, S.Kom)">
        <input type="text" id="reg-username" placeholder="Username (Untuk Login)">
        <div class="password-wrapper">
            <input type="password" id="reg-password" placeholder="Password (Min. 5 Karakter)">
            <span class="toggle-password" onclick="togglePassword('reg-password', this)">👁️</span>
        </div>
        <input type="text" id="reg-kelas" placeholder="Kelas yang Diampu (Cth: X-1, X-2)">
        <button id="btn-daftar" style="background: #2ecc71;" onclick="prosesDaftar()">📝 Daftar Sekarang</button>
        
        <p style="margin-top: 20px; font-size: 0.9rem;">
            Sudah punya akun? <a href="javascript:void(0)" onclick="tampilkanFormLogin()" style="color: #3498db; font-weight: bold; text-decoration: none;">Login di sini</a>
        </p>
    </div>
</div>

<script>
    // GANTI DENGAN URL APPS SCRIPT ANDA
    const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbzyDMjqxcjCOA41OSaYgbpvQBAddWvEO5sPJaeNWLGxJP22FwsfI41gKGafEK0CXLAh/exec";

    function togglePassword() {
        const input = document.getElementById("input-password");
        const icon = document.querySelector(".toggle-password");
        
        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "🙈"; // Ikon mata tertutup (sembunyikan)
        } else {
            input.type = "password";
            icon.textContent = "👁️"; // Ikon mata terbuka (lihat)
        }
    }
    
    async function prosesLogin() {
        const username = document.getElementById("input-username").value.trim();
        const password = document.getElementById("input-password").value.trim();
        const btn = document.getElementById("btn-login");

        if (!username || !password) {
            Swal.fire('Oops', 'Username dan Password wajib diisi!', 'warning');
            return;
        }

        btn.disabled = true;
        btn.textContent = "⏳ Memverifikasi...";

        try {
            const res = await fetch(URL_GOOGLE_SHEETS, {
                method: "POST",
                body: JSON.stringify({ aksi: "login_guru", username: username, password: password })
            });
            const json = await res.json();

            if (json.status === "success") {
                // Simpan data session
                const sessionGuru = json.data;
                sessionGuru.kelasArray = sessionGuru.kelas ? sessionGuru.kelas.split(",").map(k => k.trim()) : [];
                sessionStorage.setItem("sessionGuru", JSON.stringify(sessionGuru));

                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: `Selamat datang, ${sessionGuru.nama}`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "dashboard.html";
                });
            } else {
                Swal.fire('Akses Ditolak', json.message, 'error');
                btn.disabled = false;
                btn.textContent = "🔓 Masuk Dashboard";
            }
        } catch (err) {
            Swal.fire('Error', 'Gagal terhubung ke server.', 'error');
            btn.disabled = false;
            btn.textContent = "🔓 Masuk Dashboard";
        }
    }

    // Fungsi untuk beralih tampilan
    function tampilkanFormDaftar() {
        document.getElementById("form-login").style.display = "none";
        document.getElementById("form-daftar").style.display = "block";
        document.getElementById("judul-form").textContent = "Daftar Akun Guru";
        document.getElementById("subjudul-form").textContent = "Lengkapi data Anda untuk mendaftar.";
    }
    
    function tampilkanFormLogin() {
        document.getElementById("form-daftar").style.display = "none";
        document.getElementById("form-login").style.display = "block";
        document.getElementById("judul-form").textContent = "Login Dashboard";
        document.getElementById("subjudul-form").textContent = "Masukkan kredensial Anda untuk melanjutkan.";
    }
    
    // Fungsi untuk memproses pendaftaran
    async function prosesDaftar() {
        const nama = document.getElementById("reg-nama").value.trim();
        const username = document.getElementById("reg-username").value.trim();
        const password = document.getElementById("reg-password").value.trim();
        const kelas = document.getElementById("reg-kelas").value.trim();
        const btn = document.getElementById("btn-daftar");
    
        if (!nama || !username || !password || !kelas) {
            Swal.fire('Oops', 'Semua kolom pendaftaran wajib diisi!', 'warning');
            return;
        }
        if (password.length < 5) {
            Swal.fire('Oops', 'Password minimal 5 karakter!', 'warning');
            return;
        }
    
        btn.disabled = true;
        btn.textContent = "⏳ Mendaftar...";
    
        try {
            const res = await fetch(URL_GOOGLE_SHEETS, {
                method: "POST",
                body: JSON.stringify({ 
                    aksi: "register", 
                    nama: nama, 
                    username: username, 
                    password: password, 
                    kelas: kelas 
                })
            });
            const json = await res.json();
    
            if (json.status === "success") {
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: json.message,
                    confirmButtonText: 'Login Sekarang'
                }).then(() => {
                    tampilkanFormLogin();
                    // Isi otomatis username di form login
                    document.getElementById("input-username").value = username;
                    document.getElementById("input-password").focus();
                });
            } else {
                Swal.fire('Gagal!', json.message, 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Gagal terhubung ke server.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = "📝 Daftar Sekarang";
        }
    }
    
    // Fungsi Toggle Password (jika belum ada di file Anda)
    function togglePassword(inputId, iconElement) {
        const input = document.getElementById(id);
        // ... (kode toggle password Anda)
    }
</script>
</body>
</html>
